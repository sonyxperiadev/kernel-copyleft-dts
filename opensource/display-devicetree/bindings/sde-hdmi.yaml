%YAML 1.2
---
$id: http://devicetree.org/schemas/sde-hdmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SDE HDMI

description: |
  sde-hdmi is the master HDMI device which supports HDMI host controllers that
  are compatible with VESA HDMI interface specification.
  msm_ext_disp is a device which manages the interaction between external
  display interfaces, e.g. HDMI, and the audio subsystem.
  [Optional child nodes]: These nodes are for devices which are
  dependent on msm_ext_disp. If msm_ext_disp is disabled then
  these devices will be disabled as well. Ex. Audio Codec device.

maintainers:
  - Ashish Kumar <quic_ashik@quicinc.com>
  - Prahlad Valluru <quic_vvalluru@quicinc.com>

properties:
  compatible:
    const: qcom,hdmi-display

  reg:
    description: |
      Base address and length of HDMI hardware's memory mapped regions.

  reg-names:
    description: |
      A list of strings that name the list of regs. "hdmi_ctrl" - HDMI controller memory region.
      "hdmi_phy" - HDMI PHY memory region.
      "hdmi_ctrl" - HDMI controller memory region.
      "hdcp_phy" - HDMI HDCP memory region.

  cell-index:
    description: Specifies the controller instance.

  interrupt-parent:
    description: phandle to the interrupt parent device node.
    $ref: /schemas/types.yaml#/definitions/phandle

  interrupts:
    description: The interrupt signal from the DSI block.

  qcom,ext-disp:
    description: phandle for msm-ext-display module
    $ref: /schemas/types.yaml#/definitions/phandle
    const: qcom,msm-ext-disp

  '#clock-cells':
    description: Denotes the HDMI driver as a clock producer (has one or more clock outputs)

  clocks:
    description: Clocks required for HDMI operation.

  clock-names:
    items:
      - const: core_ahbm_clk
      - const: rpmh_cxo_clk
      - const: core_hdmi_refclk
      - const: core_app_clk
      - const: core_app_clk_rcg
      - const: pixel_clk
      - const: pixel_clk_rcg
      - const: pixel_parent
      - const: pixel_iface_clk
      - const: pixel_iface_clk_rcg

  qcom,hdmi-pll:
    description: Phandle for HDMI PLL driver

  qcom,hdmi-phy-snps-4nm:
    description: HDMI PHY version.

  qcom,pll-clk-factor:
    description: A u32 value indicating the factor to be multipled to rate. (Default:1000)

  vdda-1p2-supply:
    description: phandle to vdda 1.2V regulator node.
    $ref: /schemas/types.yaml#/definitions/phandle

  vdda-0p9-supply:
    description: phandle to vdda 0.9V regulator node.
    $ref: /schemas/types.yaml#/definitions/phandle

  vdd_mx-supply:
    description: phandle to vdda MX regulator node
    $ref: /schemas/types.yaml#/definitions/phandle

pattern properties:
  "qcom,+\w+\-supply\-entries":
    description: |
      A node that lists the elements of the supply used by the
      a particular "type" of DSI module. The module "types"
      can be "core", "ctrl", and "phy". Within the same type,
      there can be more than one instance of this binding,
      in which case the entry would be appended with the
      supply entry index.
      e.g. qcom,ctrl-supply-entry@0
    type: object
    patternProperties:
      "qcom,ctrl\-supply\-entry\@+\w":
        properties:
          reg:
            description: offset and length of the register set for the device.
          qcom,supply-name:
            description: name of the supply (vdd/vdda/vddio)
            $ref: /schemas/types.yaml#/definitions/string-array
          qcom,supply-min-voltage:
            description: minimum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-max-voltage:
            description: maximum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-enable-load:
            description: load drawn (uA) from enabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-disable-load:
            description: load drawn (uA) from disabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-on-sleep:
            description: time to sleep (ms) before turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-on-sleep:
            description: time to sleep (ms) after turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-off-sleep:
            description: time to sleep (ms) before turning off
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-off-sleep:
            description: time to sleep (ms) after turning off
            $ref: /schemas/types.yaml#/definitions/uint32
      "qcom,phy\-supply\-entry\@+\w":
        properties:
          reg:
            description: offset and length of the register set for the device.
          qcom,supply-name:
            description: name of the supply (vdd/vdda/vddio)
            $ref: /schemas/types.yaml#/definitions/string-array
          qcom,supply-min-voltage:
            description: minimum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-max-voltage:
            description: maximum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-enable-load:
            description: load drawn (uA) from enabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-disable-load:
            description: load drawn (uA) from disabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-on-sleep:
            description: time to sleep (ms) before turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-on-sleep:
            description: time to sleep (ms) after turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-off-sleep:
            description: time to sleep (ms) before turning off
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-off-sleep:
            description: time to sleep (ms) after turning off
            $ref: /schemas/types.yaml#/definitions/uint32
      "qcom,pll\-supply\-entry\@+\w":
        properties:
          reg:
            description: offset and length of the register set for the device.
          qcom,supply-name:
            description: name of the supply (vdd/vdda/vddio)
            $ref: /schemas/types.yaml#/definitions/string-array
          qcom,supply-min-voltage:
            description: minimum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-max-voltage:
            description: maximum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-enable-load:
            description: load drawn (uA) from enabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-disable-load:
            description: load drawn (uA) from disabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-on-sleep:
            description: time to sleep (ms) before turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-on-sleep:
            description: time to sleep (ms) after turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-off-sleep:
            description: time to sleep (ms) before turning off
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-off-sleep:
            description: time to sleep (ms) after turning off
            $ref: /schemas/types.yaml#/definitions/uint32
      "qcom,hpd\-supply\-entry\@+\w":
        properties:
          reg:
            description: offset and length of the register set for the device.
          qcom,supply-name:
            description: name of the supply (vdd/vdda/vddio)
            $ref: /schemas/types.yaml#/definitions/string-array
          qcom,supply-min-voltage:
            description: minimum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-max-voltage:
            description: maximum voltage level (uV)
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-enable-load:
            description: load drawn (uA) from enabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-disable-load:
            description: load drawn (uA) from disabled supply
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-on-sleep:
            description: time to sleep (ms) before turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-on-sleep:
            description: time to sleep (ms) after turning on
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-pre-off-sleep:
            description: time to sleep (ms) before turning off
            $ref: /schemas/types.yaml#/definitions/uint32
          qcom,supply-post-off-sleep:
            description: time to sleep (ms) after turning off
            $ref: /schemas/types.yaml#/definitions/uint32


required:
  - compatible
  - reg
  - reg-names
  - cell-index
  - interrupt-parent
  - interrupts
  - '#clock-cells'
  - clocks
  - clock-names
  - qcom,hdmi-pll
  - qcom,hdmi-phy-snps-4nm
  - qcom,pll-clk-factor
  - vdda-1p2-supply
  - vdda-0p9-supply
  - vdd_mx-supply
  - qcom,<type>-supply-entries

examples:
  - |
    sde_hdmi_pll: qcom,hdmi_pll@88ea000 {
      compatible = "qcom,hdmi-pll-snps-4nm";
      label = "hdmi";
      #clock-cells = <1>;
    };
  - |
    sde_hdmi: qcom,hdmi_display@af54000 {
      status = "disabled";
      compatible = "qcom,hdmi-display";

      reg = <0x0aea0000 0x67c>,
        <0x0aea1000 0x3d4>,
        <0x0aee0000 0x2c>;
      reg-names = "hdmi_ctrl", "hdmi_phy", "hdcp_phy";

      interrupt-parent = <&mdss_mdp>;
      interrupts = <8 0>;

      qcom,ext-disp = <&ext_disp>;
      #clock-cells = <1>;
      clocks = <&dispcc DISP_CC_MDSS_HDMI_AHBM_CLK>,
        <&rpmhcc RPMH_CXO_CLK>,
        <&tcsrcc TCSR_HDMI_CLKREF_EN>,
        <&dispcc DISP_CC_MDSS_HDMI_APP_CLK>,
        <&dispcc DISP_CC_MDSS_HDMI_APP_CLK_SRC>,
        <&dispcc DISP_CC_MDSS_HDMI_PCLK_CLK>,
        <&dispcc DISP_CC_MDSS_HDMI_PCLK_CLK_SRC>,
        <&sde_hdmi_pll 0>,
        <&dispcc DISP_CC_MDSS_HDMI_INTF_CLK>,
        <&dispcc DISP_CC_MDSS_HDMI_PCLK_DIV_CLK_SRC>;
      clock-names = "core_ahbm_clk", "rpmh_cxo_clk",
        "core_hdmi_refclk", "core_app_clk", "core_app_clk_rcg",
        "pixel_clk", "pixel_clk_rcg", "pixel_parent",
        "pixel_iface_clk", "pixel_iface_clk_rcg";

      qcom,hdmi-pll = <&sde_hdmi_pll>;
      qcom,hdmi-phy-snps-4nm;
      qcom,pll-clk-factor = <1000>;

      vdda-1p2-supply = <&L4B>;
      vdda-0p9-supply = <&L2B>;
      vdd_mx-supply = <&VDD_MXA_LEVEL>;

      qcom,ctrl-supply-entries {
        #address-cells = <1>;
        #size-cells = <0>;

        qcom,ctrl-supply-entry@0 {
          reg = <0>;
          qcom,supply-name = "vdda-1p2";
          qcom,supply-min-voltage = <1200000>;
          qcom,supply-max-voltage = <1320000>;
          qcom,supply-enable-load = <30000>;
          qcom,supply-disable-load = <0>;
        };
      };
      qcom,phy-supply-entries {
        #address-cells = <1>;
        #size-cells = <0>;

        qcom,phy-supply-entry@0 {
          reg = <0>;
          qcom,supply-name = "vdda-0p9";
          qcom,supply-min-voltage = <912000>;
          qcom,supply-max-voltage = <950000>;
          qcom,supply-enable-load = <114000>;
          qcom,supply-disable-load = <0>;
        };
      };

      qcom,pll-supply-entries {
        #address-cells = <1>;
        #size-cells = <0>;

        qcom,pll-supply-entry@0 {
          reg = <0>;
          qcom,supply-name = "vdd_mx";
          qcom,supply-min-voltage =
              <RPMH_REGULATOR_LEVEL_TURBO>;
          qcom,supply-max-voltage =
              <RPMH_REGULATOR_LEVEL_MAX>;
          qcom,supply-enable-load = <0>;
          qcom,supply-disable-load = <0>;
        };
      };

      qcom,hpd-supply-entries {
        #address-cells = <1>;
        #size-cells = <0>;

        qcom,hpd-supply-entry@0 {
          reg = <0>;
          qcom,supply-name = "vdd_5p0";
          qcom,supply-min-voltage = <5000000>;
          qcom,supply-max-voltage = <5000000>;
          qcom,supply-enable-load = <0>;
          qcom,supply-disable-load = <0>;
        };
      };
    };
